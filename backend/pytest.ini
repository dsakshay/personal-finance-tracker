[pytest]
# Pytest configuration for Personal Finance Tracker

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable ROS pytest plugins that conflict with our tests
addopts =
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_lint
    -p no:ament_xmllint
    -p no:launch_testing
    -p no:launch_testing_ros
    -v

# Test paths
testpaths = tests

# Async mode
asyncio_mode = auto
